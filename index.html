<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>MIT-WPU Law Library - New Arrivals</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->

        <img src="Images/logo.png" alt="MIT-WPU Logo" class="logo">

    src="Images/Book2.png.png"

<img src="Images/Book5.png.png" class="book"
     data-title="How India Votes"

<img src="Images/Book6.png.png" class="book"

<img src="Images/Book9.png.png" class="book"

<img src="Images/Book11.png.png" class="book"

     data-author="CA A. Jatin Christopher">
<img src="Images/Book12.png.png" class="book"
     data-title="Commercial Dispute Resolution: State of the Law in India"
     data-author="Anirudh Krishnan">

        </div>

        <button class="nav next">&#10095;</button>

    </div>

    <!-- Book Details -->
    <div class="book-info">

        <h2 id="book-title">NEW ARRIVALS</h2>

        <p id="book-author">
            MIT-WPU Law Library
        </p>

    <script src="script.js"></script>
